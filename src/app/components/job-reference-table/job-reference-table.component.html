<ion-searchbar
  debounce="250"
  mode="ios"
  placeholder="Search by code, site address or customer"
  (ionChange)="updateFilter($event)"
>
</ion-searchbar>
<ion-item lines="none" mode="ios">
  <ion-select
    #rows
    slot="start"
    placeholder="15"
    interface="popover"
    [value]="15"
  >
    <ion-select-option value="7">7</ion-select-option>
    <ion-select-option value="10">10</ion-select-option>
    <ion-select-option value="50">50</ion-select-option>
    <ion-select-option value="100">100</ion-select-option>
  </ion-select>
</ion-item>
<ngx-datatable
  class="bootstrap striped rounded-lg"
  [limit]="rows.value"
  [rows]="temp$ | async"
  [rowHeight]="50"
  [columnMode]="'force'"
  [sortType]="sortType.multi"
  [headerHeight]="50"
  [footerHeight]="50"
  [selectionType]="selectionType.single"
  trackByProp="code"
  [scrollbarH]="true"
  (select)="onSelect($event)"
  [selected]="selected"
>
  <ngx-datatable-column name="Code"></ngx-datatable-column>
  <ngx-datatable-column
    name="Job Reference"
    prop="jobReference"
  ></ngx-datatable-column>
  <ngx-datatable-column
    name="Site Address"
    prop="site.name"
  ></ngx-datatable-column>
  <ngx-datatable-column
    name="Customer"
    prop="site.customer.name"
  ></ngx-datatable-column>
  <ngx-datatable-column name="Date" prop="date">
    <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
      {{ value | dateFormat | date: "dd MMM yyyy" }}
    </ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column name="Billing Date" prop="endDate" *ngIf="showEndDate">
    <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
      {{ value | dateFormat | date: "dd MMM yyyy" }}
    </ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column
    *ngIf="showLastInvoiceDate"
    name="Last Invoice"
    prop="lastInvoiceDate"
  >
    <ng-template let-value="value" ngx-datatable-cell-template>
      <ng-container *ngIf="value; else noInvoice">
        {{ value | dateFormat | date: "dd MMM yyyy" }}
      </ng-container>
      <ng-template #noInvoice>—</ng-template>
    </ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column
    name="Created By"
    prop="createdByName"
  ></ngx-datatable-column>
  <ngx-datatable-column
    name="Total"
    prop="total"
    cellClass="text-end my-auto"
    headerClass="text-end"
  >
    <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
      <ion-badge color="success" mode="ios">
        {{ value | number: "0.2-2" }}
      </ion-badge>
    </ng-template>
  </ngx-datatable-column>
</ngx-datatable>
