<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon
          slot="icon-only"
          name="arrow-back-outline"
          color="primary"
        ></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Duplicate Item </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-grid>
      <ion-row class="card-outline mb-3">

        <ion-col sizeMd="3" size="12">
          <app-input-reactive title="Code" controlName="code" [form]="form">
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Category"
            controlName="category"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive title="Size" controlName="size" [form]="form">
          </app-input-reactive>
        </ion-col>

        <ion-col sizeMd="3" size="12">
          <app-input-select-reactive
            title="Type"
            placeholder="Select Type"
            controlName="type"
            [form]="form"
            [selectedText]="field('type').value || ''"
          >
            <ion-select-option value="Component"> Component </ion-select-option>
            <ion-select-option value="Consumable">
              Consumable
            </ion-select-option>
            <ion-select-option value="Motor"> Motor </ion-select-option>
          </app-input-select-reactive>
        </ion-col>

        <ion-col sizeMd="6" size="12">
          <app-input-reactive
            title="Description"
            controlName="name"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Location"
            controlName="location"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Supplier"
            controlName="supplier"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col size="12">
          <app-input-reactive
            title="Yard Qty"
            inputmode="numeric"
            type="number"
            controlName="yardQty"
            [form]="form"
            (fieldChange)="update()"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Weight  ({{ company.mass.symbol }})"
            inputmode="numeric"
            type="number"
            controlName="weight"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Hire/Rent Cost ({{ company.currency.symbol }})"
            inputmode="numeric"
            type="number"
            controlName="hireCost"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Replacement Cost ({{ company.currency.symbol }})"
            inputmode="numeric"
            type="number"
            controlName="replacementCost"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
        <ion-col sizeMd="3" size="12">
          <app-input-reactive
            title="Selling Cost ({{ company.currency.symbol }})"
            inputmode="numeric"
            type="number"
            controlName="sellingCost"
            [form]="form"
          >
          </app-input-reactive>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12" class="text-end">
          <ion-progress-bar
            type="indeterminate"
            *ngIf="loading"
          ></ion-progress-bar>
          <ion-button
            shape="round"
            [disabled]="form.invalid"
            *ngIf="!loading"
            (click)="createItem()"
            >Duplicate Item</ion-button
          >
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
